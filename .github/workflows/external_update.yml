name: external_update

on:
  schedule:
    # Cada 6 horas refresca macro/onchain/sentiment/cross-crypto/funding
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external_update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Update external sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_external_data.py
      - name: Commit cache
        run: |
          git config user.name  "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/live_features data/logs || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "external_update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
