name: paper_trader

on:
  schedule:
    # GitHub no garantiza ejecucion cada 5 min; en la practica suele tardar
    # algunos minutos extra. El script decide internamente que TF procesar.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no abre operaciones)"
        type: boolean
        default: false
      force_tf:
        description: "Forzar timeframes (csv, ej. 15m,1h)"
        type: string
        default: ""

permissions:
  contents: write   # para commitear state/trades/dashboard al repo

concurrency:
  group: paper_trader
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper tick
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.force_tf }}" ]; then ARGS="$ARGS --force-tf ${{ inputs.force_tf }}"; fi
          python scripts/run_paper_tick.py $ARGS

      - name: Commit state, trades and dashboard data
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/state data/paper_trades data/logs dashboard/data || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "tick: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
