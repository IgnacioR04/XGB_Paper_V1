name: paper_trader

on:
  schedule:
    # GitHub no garantiza ejecucion cada 5 min; en la practica suele tardar
    # algunos minutos extra. El script decide internamente que TF procesar.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no abre operaciones)"
        type: boolean
        default: false
      force_tf:
        description: "Forzar timeframes (csv, ej. 15m,1h)"
        type: string
        default: ""

permissions:
  contents: write   # para commitear state/trades/dashboard al repo

concurrency:
  group: paper_trader
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connectivity diagnostics (verify Binance reachable)
        run: |
          echo "::group::Public IP of runner"
          curl -s https://api.ipify.org || true
          echo ""
          echo "::endgroup::"
          echo "::group::api.binance.com /ping"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://api.binance.com/api/v3/ping" || true
          echo "::endgroup::"
          echo "::group::api.binance.com /klines (BTCUSDT 15m limit=1)"
          curl -sS -o /tmp/k.json -w "HTTP %{http_code}\n" "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=1" || true
          head -c 500 /tmp/k.json 2>/dev/null; echo ""
          echo "::endgroup::"
          echo "::group::fapi.binance.com /ping"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://fapi.binance.com/fapi/v1/ping" || true
          echo "::endgroup::"
          echo "::group::data.binance.vision"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://data.binance.vision/" || true
          echo "::endgroup::"

      - name: Run paper tick (bot principal)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.force_tf }}" ]; then ARGS="$ARGS --force-tf ${{ inputs.force_tf }}"; fi
          python scripts/run_paper_tick.py $ARGS

      - name: Run paper tick (MODELO OOF)
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS="--profile oof"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.force_tf }}" ]; then ARGS="$ARGS --force-tf ${{ inputs.force_tf }}"; fi
          python scripts/run_paper_tick.py $ARGS

      - name: Run paper tick (MODELO EN PRODUCCION - Bitget LIVE 4h)
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: |
          # Solo correr si los 3 secretos Bitget estan presentes (evita crashear el job)
          if [ -z "$BITGET_API_KEY" ] || [ -z "$BITGET_API_SECRET" ] || [ -z "$BITGET_PASSPHRASE" ]; then
            echo "::warning::Bitget secrets ausentes; saltando bot LIVE 4h"
            exit 0
          fi
          ARGS="--profile live4h"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.force_tf }}" ]; then ARGS="$ARGS --force-tf ${{ inputs.force_tf }}"; fi
          python scripts/run_paper_tick.py $ARGS

      - name: Show last_tick.json (debug)
        if: always()
        run: |
          if [ -f data/logs/last_tick.json ]; then
            echo "::group::last_tick.json"
            cat data/logs/last_tick.json
            echo "::endgroup::"
          else
            echo "WARNING: data/logs/last_tick.json NOT created. Python script crashed before scheduler phase."
          fi
          echo "::group::Files written in data/logs"
          find data/logs -type f -not -name '.gitkeep' || true
          echo "::endgroup::"

      - name: Commit state, trades and dashboard data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/state data/paper_trades data/logs dashboard/data \
                     data/state_oof data/paper_trades_oof data/logs_oof dashboard/data_oof \
                     data/state_live4h data/paper_trades_live4h data/logs_live4h dashboard/data_live4h || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "tick: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash origin main || true
            git push
          fi
