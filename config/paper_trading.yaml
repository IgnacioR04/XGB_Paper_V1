# ============================================================
# Paper trading config - XGB_Paper_V1 (v3 top-3 filtros)
# ============================================================

version: "paper_v3_top3"
mode: "paper"
execution_market: "paper_synthetic"

# ---------------------------------------------------------------
# Carteras independientes - 100 EUR cada una (reseteadas v3)
# 15m queda deshabilitado: ningun filtro 15m supero el estudio
# de contribucion por filtro (seccion 11 de RS01). Solo operan
# 1h y 4h en los regimenes ganadores.
# ---------------------------------------------------------------
wallets:
  "15m":
    initial_capital_eur: 100.0
    enabled: false
  "1h":
    initial_capital_eur: 100.0
    enabled: true
  "4h":
    initial_capital_eur: 100.0
    enabled: true

allow_cross_timeframe_positions: true
max_positions_per_wallet: 1

# ---------------------------------------------------------------
# Reglas por regimen y timeframe (v3 - SOLO los 3 filtros ganadores)
#
# Regimen se clasifica con EMA50 vs EMA200 en 1h (causal):
#   alcista: close > EMA200 AND EMA50 > EMA200
#   bajista: close < EMA200 AND EMA50 < EMA200
#   lateral: todo lo demas
#
# Tras el estudio de contribucion por filtro a 1x (RS01 seccion 11),
# solo se conservan los 3 filtros con PnL y Sharpe netos positivos.
# Cada uno mantiene el leverage que tenia asignado previamente.
# Eliminados: 15m lateral, 4h alcista, 4h lateral.
#
# threshold = p_win_calibrated minimo para operar
# leverage = apalancamiento sobre el cash disponible
# ---------------------------------------------------------------
regime_rules:
  "1h":
    bajista:
      enabled: true
      threshold: 0.55
      leverage: 2.0
    lateral:
      enabled: true
      threshold: 0.55
      leverage: 4.0
  "4h":
    bajista:
      enabled: true
      threshold: 0.75
      leverage: 5.0

# Banda abierta por arriba (opera todo candidato con p >= threshold)
allow_above_band: true
# No requiere EV positivo (el threshold ya filtra)
require_positive_ev: false

# ---------------------------------------------------------------
# Costes (round-trip, sin cambios)
# ---------------------------------------------------------------
costs:
  fee_in: 0.0006
  fee_out: 0.0006
  total_round_trip: 0.0012

# ---------------------------------------------------------------
# Modo de senal
# ---------------------------------------------------------------
signal_mode: "closed_candle_only"
selection_policy: "top_EV_per_timeframe"
allowed_sides: ["long", "short"]

# ---------------------------------------------------------------
# Scheduler (GitHub Actions cron */5)
# ---------------------------------------------------------------
scheduler:
  run_every_minutes: 5
  candle_close_delay_seconds:
    "15m": 20
    "1h": 30
    "4h": 60
  max_late_minutes:
    "15m": 12
    "1h": 45
    "4h": 180

# ---------------------------------------------------------------
# Feature mode
# ---------------------------------------------------------------
feature_mode: "live_recompute"
external_artifacts_path: ""
feature_nan_policy: "tolerate"

# ---------------------------------------------------------------
# Stop conditions de seguridad (paper)
# ---------------------------------------------------------------
stop_conditions:
  consecutive_losses_max: 10
  daily_drawdown_max: -0.10
  weekly_drawdown_max: -0.20
